name: Python-testar med låste pakkar
on:
  push:
    branches: [main]
    paths:
      - 'medlemsregister/**'
      - '_data/**'
      - '_tillegg/**'
      - 'lutar/**'
      - '.github/workflows/python-tests.yml'
  pull_request:
    paths:
      - 'medlemsregister/**'
      - '_data/**'
      - '_tillegg/**'
      - 'lutar/**'
      - '.github/workflows/python-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'medlemsregister/requirements*.txt'
      - run: python -m pip install -r medlemsregister/requirements-pythonanywhere.txt
      - run: python -m pip check
      - name: Køyr testar utan produksjonsløyndomar
        env:
          PYTHONPATH: medlemsregister
          MEDLEMSREGISTER_DB_KEY: ''
          SMTP_HOST: ''
          BREVO_API_KEY: ''
        run: python -W always::ResourceWarning -m unittest discover -s medlemsregister/tests
