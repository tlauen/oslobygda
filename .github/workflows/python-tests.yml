name: Python-testar med låste pakkar
on:
  push:
    branches: [main]
    paths:
      - 'medlemsregister/**'
      - '_data/**'
      - '_tillegg/**'
      - 'lutar/**'
      - '.github/workflows/python-tests.yml'
      - 'ruff.toml'
      - 'skript/**'
  pull_request:
    paths:
      - 'medlemsregister/**'
      - '_data/**'
      - '_tillegg/**'
      - 'lutar/**'
      - '.github/workflows/python-tests.yml'
      - 'ruff.toml'
      - 'skript/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'medlemsregister/requirements*.txt'
      - run: python -m pip install -r medlemsregister/requirements-dev.txt
      - run: python -m pip check
      - name: Kontroller format i betalingskoden
        run: ruff format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kontroller stegvis utfylling
        env:
          PYTHONPATH: medlemsregister:medlemsregister/tests
          PYTHON_DOTENV_DISABLED: '1'
          MEDLEMSREGISTER_DB_KEY: ''
          SMTP_HOST: ''
          BREVO_API_KEY: ''
        run: |
          npm ci --prefix skript --ignore-scripts --no-audit --no-fund
          python skript/skjemasteg_testdata.py > "$RUNNER_TEMP/skjemasteg.json"
          SKJEMASTEG_TESTDATA="$RUNNER_TEMP/skjemasteg.json" npm test --prefix skript
      - name: Kontroller skjema i ekte nettlesar og mobilbreidd
        env:
          SKJEMASTEG_TESTDATA: ${{ runner.temp }}/skjemasteg.json
          SKJEMASTEG_SCREENSHOTS: ${{ runner.temp }}/skjemasteg-bilete
        run: |
          skript/node_modules/.bin/playwright install --with-deps chromium
          node skript/test_skjemasteg_browser.cjs
      - name: Ta vare på skjermbilete frå skjemakontrollen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skjemasteg-mobil-og-datamaskin
          path: ${{ runner.temp }}/skjemasteg-bilete
          if-no-files-found: ignore
          retention-days: 7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Kontroller kalender og nyhendebrev
        run: |
          node skript/test_kalender.js
          ruby skript/test_nyhendebrev.rb
      - name: Kontroller serveroppdateraren
        env:
          PYTHONPATH: medlemsregister
        run: python -m unittest discover -s skript -p 'test_*.py'
      - name: Kontroller offentleg prisvising
        run: node skript/test_kontingent.js
      - name: Køyr testar utan produksjonsløyndomar
        env:
          PYTHONPATH: medlemsregister
          MEDLEMSREGISTER_DB_KEY: ''
          SMTP_HOST: ''
          BREVO_API_KEY: ''
        run: python -W always::ResourceWarning -m unittest discover -s medlemsregister/tests
