name: Bygg offentlege dokument og PDF
on:
  push:
    branches: [main]
    paths:
      - '_data/arsdokument/**'
      - '_data/rekneskapskategoriar.json'
      - '_data/balanseforklaringar.json'
      - '_data/styre.yml'
      - 'medlemsregister/arsmelding_offentleg.py'
      - 'medlemsregister/dokumentvising.py'
      - 'medlemsregister/malar/arsmote_utskrift.html'
      - 'medlemsregister/malar/_favicon.html'
      - 'medlemsregister/malar/_arsmelding_vising.html'
      - 'medlemsregister/fast/arsmote-utskrift.css'
      - 'medlemsregister/fast/arsmelding-tilskipingar.css'
      - 'skript/bygg_arsdokument.py'
      - '.github/workflows/arsdokument.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: offentlege-arsdokument
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r medlemsregister/requirements-common.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Lagre ferdige dokument
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Berre den mellombelse CI-utsjekkinga blir nullstilt. Bygg alltid
          # frå siste main dersom nokon publiserer medan jobben køyrer.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python skript/bygg_arsdokument.py
            git add lutar/arsdokument
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m 'Bygg offentlege dokument og PDF'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          echo 'Dokumentfilene kunne ikkje lagrast etter fire forsøk.' >&2
          exit 1
      - name: Bygg nettsida med dei ferdige dokumentfilene
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
