name: Køyr testar
on:
  pull_request:
    paths:
      - 'medlemsregister/**'
      - '_data/**'
      - '_tillegg/**'
      - '.github/workflows/tester.yml'
  push:
    branches: [main]
    paths:
      - 'medlemsregister/**'
      - '_data/**'
      - '_tillegg/**'
      - '.github/workflows/tester.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tester-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: medlemsregister/requirements-common.txt
      - run: pip install -r medlemsregister/requirements-common.txt
      # Testane krev Linux (bilag.py brukar fcntl). Dei er skrivne for unittest.
      - name: Køyr testar
        working-directory: medlemsregister
        run: python -m unittest discover -s tests
