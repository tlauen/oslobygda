<section class="om-modul" aria-labelledby="dokument-tittel"><p class="modul-etikett">Om laget</p><h2 id="dokument-tittel">Dokument</h2><div class="dokument-grid">{% for dokument in site.data.dokument %}<a class="dokument-kort" href="{{ dokument.lenkje | relative_url | escape }}"><span class="dokument-type">{{ dokument.type | escape }}</span><h3>{{ dokument.tittel | escape }}</h3><p>{{ dokument.omtale | escape }}</p><span class="dokument-opne">Opne dokumentet <span aria-hidden="true">↗</span></span></a>{% endfor %}</div></section>
