<section class="om-modul" aria-labelledby="styret-tittel"><p class="modul-etikett">Folka bak</p><h2 id="styret-tittel">Styret</h2><div class="styre-grid">{% for person in site.data.styre %}<article class="styre-kort">{% if person.bilete %}<img src="{{ person.bilete | relative_url | escape }}" alt="{{ person.namn | escape }}" loading="lazy" width="480" height="480">{% else %}<div class="styre-portrett" aria-hidden="true">{{ person.initialar | escape }}</div>{% endif %}<div class="styre-kort__tekst"><p>{{ person.rolle | escape }}</p><h3>{{ person.namn | escape }}</h3></div></article>{% endfor %}</div></section>
