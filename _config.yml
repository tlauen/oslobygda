# Valfritt: gjer fine permalinks for sider
permalink: pretty

includes_dir: _tillegg
layouts_dir: _utforming

sass:
  sass_dir: lutar/stilar
# Salsvilkår: set først true etter at kontaktopplysningar og vilkår er stadfesta.
salsvilkar_publiserte: true
