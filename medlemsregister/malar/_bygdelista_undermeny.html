{% import '_bygdelista_menydata.html' as navigation with context %}
<details class="bygdelista-navigasjon" open>
<summary>Meny</summary>
<nav class="bygdelista-delar" aria-label="Delar av Bygdelista">
  {% for key,label,endpoint,items in navigation.modules %}
  <div class="bygdelista-menygruppe">
    <a href="{{ prefix_url(endpoint) }}"{% if navigation.active.key==key %} aria-current="page"{% endif %}>{{ label }}</a>
    {% if navigation.active.key==key %}
    <nav class="bygdelista-undermeny" aria-label="{{ navigation.section }}">
      {% for item_endpoint,item_label,family in items %}
      <a href="{{ prefix_url(item_endpoint) }}"{% if request.endpoint in family %} aria-current="page"{% endif %}>{{ item_label }}</a>
      {% endfor %}
    </nav>
    {% endif %}
  </div>
  {% endfor %}
</nav>
</details>
<script defer src="{{ prefix_url('static',filename='bygdelista-nav.js') }}"></script>
