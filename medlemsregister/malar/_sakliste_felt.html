<fieldset><legend>Sak</legend><label>Tittel<input name="item_title" value="{{ item.title }}" maxlength="200" required></label><label>Undersaker (éi per linje, utan nummer)<textarea name="item_subitems" rows="3" maxlength="6030">{{ item.get('subitems',[])|join('\n') }}</textarea></label><label>Omtale av saka<textarea name="item_body" rows="4" maxlength="6000">{{ item.body }}</textarea></label><label>Forslag til vedtak<textarea name="item_proposal" rows="4" maxlength="6000">{{ item.get('proposal','') }}</textarea></label><label>Lenkje til årsmøtedokument<select name="item_document"><option value="">Ingen dokumentkopling</option>{% for value,label in choices.items() %}<option value="{{ value }}" {% if item.document==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><div class="knappar"><button type="button" class="sekundaer" data-move="up" aria-label="Flytt saka opp">↑ Opp</button><button type="button" class="sekundaer" data-move="down" aria-label="Flytt saka ned">↓ Ned</button><button type="button" class="sekundaer" data-move="remove">Fjern saka</button></div></fieldset>
