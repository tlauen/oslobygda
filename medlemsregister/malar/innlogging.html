<!DOCTYPE html>
<html lang="nn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bygdelista – Medlemsregisteret for Oslobygda kulturlag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ prefix_url('static', filename='stil.css') }}" />
</head>
<body class="innlogging-kropp">
  <main class="innlogging-boks">
    <h1>Bygdelista – Medlemsregisteret for Oslobygda kulturlag</h1>
    <p class="ingress">Logg inn for å opne lista.</p>
    {% if error %}
    <p class="feil">{{ error }}</p>
    {% endif %}
    <form method="post" action="{{ prefix_url('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label for="username">E-post eller brukarnamn</label>
      <input id="username" name="username" required autocomplete="username" maxlength="100" />
      <label for="password">Passord</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />
      <label for="code">Kode frå autentiseringsappen</label>
      <input id="code" name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" />
      <button type="submit">Logg inn</button>
    </form>
    <p><a href="{{ prefix_url('board_register') }}">Opprett styrekonto</a></p>
  </main>
</body>
</html>
