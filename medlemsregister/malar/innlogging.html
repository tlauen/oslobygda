<!DOCTYPE html>
<html lang="nn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logg inn – Bygdelista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ prefix_url('static', filename='stil.css') }}" />
  <script src="{{ prefix_url('static', filename='innlogging-kode.js') }}" defer></script>
{% include '_favicon.html' %}</head>
<body class="innlogging-kropp">
  <main class="innlogging-boks">
    <h1>Logg inn i Bygdelista</h1>
    <p class="ingress">Medlemsregisteret for Oslobygda kulturlag.</p>
    {% if error %}
    <p class="feil">{{ error }}</p>
    {% endif %}
    <form id="login-form" name="login" aria-label="Logg inn" method="post" action="{{ prefix_url('login') }}" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label for="username">E-post eller brukarnamn</label>
      <input type="text" id="username" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="100" />
      <label for="password">Passord</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" />
      <label for="code">Kode frå autentiseringsappen</label>
      <div class="innlogging-koderuter">
        <div class="innlogging-kodebakgrunn" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <input type="text" id="code" name="code" class="innlogging-kode" required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="one-time-code" spellcheck="false" aria-describedby="kode-hjelp" />
      </div>
      <p id="kode-hjelp" class="innlogging-kodehjelp">Seks siffer frå autentiseringsappen.</p>
      <button type="submit" name="login">Logg inn</button>
    </form>
    <nav class="innlogging-val" aria-label="Hjelp med styrekonto">
      <a class="btn sekundaer" href="{{ prefix_url('forgot_password') }}">Gløymt passord?</a>
      <a class="btn sekundaer" href="{{ prefix_url('board_register') }}">Opprett styrekonto</a>
    </nav>
  </main>
</body>
</html>
