<a class="arsmote-hopp" href="#hovudinnhald">Hopp til innhald</a>
{% include '_bygdelista_topp.html' %}
{% include '_bygdelista_undermeny.html' %}
<div id="hovudinnhald" tabindex="-1"></div>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 document.querySelectorAll('.arsmote-kropp table, .okonomi-tabell').forEach(table=>{
  if(!table.dataset.viewControl){
   table.dataset.viewControl='yes';
   const button=document.createElement('button');button.type='button';button.className='tabell-vising';
   table.classList.add('kompakt-tabell');
   button.textContent='Detaljert vising';button.setAttribute('aria-pressed','true');
   button.addEventListener('click',()=>{const compact=table.classList.toggle('kompakt-tabell');button.setAttribute('aria-pressed',String(compact));button.textContent=compact?'Detaljert vising':'Kompakt vising';});
   table.parentElement.insertBefore(button,table);
  }
  const labels=Array.from(table.querySelectorAll('thead th'),th=>th.textContent.trim());
  table.querySelectorAll('tbody tr').forEach(row=>{
   Array.from(row.cells).forEach((cell,index)=>{if(cell.tagName==='TD')cell.dataset.column=labels[index]||'';});
  });
 });
});
</script>
