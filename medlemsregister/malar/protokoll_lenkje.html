<!doctype html><html lang="nn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Personleg protokolltilgang – Bygdelista</title><link rel="stylesheet" href="{{ prefix_url('static',filename='stil.css') }}"><link rel="stylesheet" href="{{ prefix_url('static',filename='arsmote.css') }}"><link rel="stylesheet" href="{{ prefix_url('static',filename='bygdelista.css') }}"></head><body class="arsmote-kropp bygdelista-kropp"><main class="omslag"><h1>Personleg protokolltilgang</h1>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<p id="lenkje-status">Opne heile den personlege lenkja frå e-posten.</p>
<form method="post" id="opne-lenkje"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="action" value="open"><input type="hidden" name="token" id="personleg-token"><button>Opne protokollen</button></form><noscript>Slå på JavaScript for å opne den personlege lenkja.</noscript>
<script>const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);if(/^[A-Za-z0-9_-]{43}$/.test(token)){document.getElementById('personleg-token').value=token;document.getElementById('lenkje-status').textContent='Lenkja er personleg. Trykk for å opne protokollen.';}else{document.getElementById('opne-lenkje').hidden=true;}</script>
</main></body></html>
